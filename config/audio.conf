# FXBox audio settings — installed as /etc/fxbox/audio.conf
# Read by fxbox-jack.service and fxbox-engine.service. After a change:
#   sudo systemctl restart fxbox-jack fxbox-engine

# ALSA card id of the ZynADAC / HiFiBerry DAC+ ADC Pro (overlay hifiberry-dacplusadcpro)
ALSA_CARD=sndrpihifiberry
SAMPLE_RATE=48000
# Frames per period and number of periods. 128 x 2 at 48 kHz = 2.7 ms per period.
# If you hear crackles (xruns, see Instellingen > Info), use PERIOD=256.
PERIOD=128
NPERIODS=2
JACK_PRIO=70
JACK_EXTRA=

# DIN MIDI on the Pi UART. With the midi-uart0 overlay, 38400 on the tty is
# 31250 baud on the wire (same method as Zynthian).
DIN_DEVICE=/dev/ttyAMA0
DIN_BAUD=38400
